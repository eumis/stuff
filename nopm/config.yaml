install_dir:
  linux: /usr/local/bin
  windows: C:\\tools
opt_dir:
  linux: /opt
  windows: C:\\tools
apps_dir: /usr/share/applications
fonts_dir: /usr/share/fonts
sudo_install: true
shell:
  linux: /usr/bin/bash
  windows: C:\\Program Files\\Git\\bin\\bash.exe
pre: |
  if [[ $args =~ 'nopm'|'kuplay'|'ruf' || $args == "check" ]]; then
    ssh-add ~/.ssh/github
  fi
