exe: nvim
template: github
description: neovim text editor
source: https://github.com/neovim/neovim
install:
  windows: |
    cp -r ./content/nvim-win64 $opt_dir/nvim
    export NVIM_BIN="$(cygpath -w $install_dir/nvim/bin)"
    powershell.exe -NoProfile -Command '
      $path = [Environment]::GetEnvironmentVariable("Path", "User")
      $newDir = $env:NVIM_BIN

      if ($newDir -notin ($path -split ";")) {
        [Environment]::SetEnvironmentVariable(
          "Path",
          "$path;$newDir",
          "User"
        )
      }
    '
install_hook:
  linux: ln -sf $HOME/stuff/nvim $HOME/.config
  windows: |
    if [[ ! -d "$LOCALAPPDATA/nvim" ]]; then
      cmd.exe //c "mklink /D %LOCALAPPDATA%\nvim %USERPROFILE%\stuff\nvim"
    fi
uninstall:
  windows: rm -rf $install_dir/nvim
uninstall_hook:
  linux: rm -f $HOME/.config/nvim
  windows: rm -f $LOCALAPPDATA/nvim
